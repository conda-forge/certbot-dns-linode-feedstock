context:
  version: "5.9.0"

package:
  name: certbot-dns-linode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-linode/certbot_dns_linode-${{ version }}.tar.gz
  sha256: c3f201ff08a4e8df61c41b6626f79fd894d5492e18771bfb817104a86d306be9

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - dns-lexicon >=3.14.1

tests:
  - python:
      imports:
        - certbot_dns_linode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: Linode DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
